name: Sync Upstream and Build

on:
  schedule:
    - cron: '0 22 * * *'  # 每天北京时间上午10点（UTC+8 = UTC 2:00）
  workflow_dispatch:       # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}

    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          ref: private/custom-ui
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/lobehub/lobehub.git || true
          git fetch upstream main

      - name: Check if upstream has new commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_SHA" = "$MERGE_BASE" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits, skipping."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New upstream commits found."
          fi

      - name: Merge upstream main
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/main --no-edit --strategy-option=ours || true

      - name: Check for merge conflicts
        if: steps.check.outputs.has_changes == 'true'
        id: conflict
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            git diff --name-only --diff-filter=U
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

      - name: Push merged branch
        if: steps.check.outputs.has_changes == 'true' && steps.conflict.outputs.has_conflicts == 'false'
        run: |
          git push origin private/custom-ui

      - name: Notify on conflict
        if: steps.conflict.outputs.has_conflicts == 'true'
        run: |
          echo "⚠️ Merge conflicts detected! Manual resolution required."
          echo "Conflicting files:"
          git diff --name-only --diff-filter=U
          exit 1  # 让 Actions 标红，你会收到 GitHub 邮件通知

  build:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: private/custom-ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lobehub-private:latest
            ${{ secrets.DOCKER_USERNAME }}/lobehub-private:${{ github.run_number }}
          build-args: |
            DOCKER=true
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            KEY_VAULTS_SECRET=${{ secrets.KEY_VAULTS_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
