name: Build and Push Private LobeChat

on:
  push:
    branches:
      - private/custom-ui
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Random Secrets for Build
        id: secrets
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "KEY_VAULTS_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lobehub-private:latest
          build-args: |
            DOCKER=true
            AUTH_SECRET=${{ env.AUTH_SECRET }}
            KEY_VAULTS_SECRET=${{ env.KEY_VAULTS_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
